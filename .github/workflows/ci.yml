name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # drift's NativeDatabase (schema_test.dart, local_logic_test.dart) loads
      # the system sqlite3 shared library at runtime.
      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # No TEST_SUPABASE_* / SUPABASE_* --dart-define values are passed here, and
      # that is deliberate: full_integration_test.dart and
      # full_backend_integration_test.dart both gate on all four TEST_* values
      # plus Env.hasValidConfig, so they self-skip. Those two drive the LIVE
      # production Supabase project of a real mosque -- creating and deleting
      # real rows -- and must never run unattended on CI. Do not add those
      # secrets to this workflow.
      - name: Test
        run: flutter test
